<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Footing in soil · simulation</title><style>
:root{--navy:#0F2E5A;--ink:#14243a;--muted:#5d6b7c;--line:#dfe5ec;--blue:#1E63B8;--amb:#F0A500;--grn:#16A34A;--grn2:#22C55E;--red:#DC2626;--sign:#77797c}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1b2e;font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
button{font-family:inherit}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;background:#cfdbe6;-webkit-user-select:none;user-select:none}
#cv{position:absolute;inset:0;width:1600px;height:900px}#ov{position:absolute;inset:0;touch-action:none;outline:none}#lbls{position:absolute;inset:0;pointer-events:none}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 50%,rgba(220,38,38,0) 45%,rgba(220,38,38,.38));z-index:2}#flash.go{animation:fl 1.4s ease-out}@keyframes fl{0%{opacity:1}100%{opacity:0}}
/* ---- top bar: home · title · steps · CC / sound / sign · back / next */
#bar{position:absolute;left:0;right:0;top:0;height:58px;display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(255,255,255,.95);box-shadow:0 2px 16px rgba(15,46,90,.16);z-index:12}
.btn{height:42px;min-width:42px;border:0;border-radius:12px;background:#eef2f7;color:var(--navy);font:700 15px Inter,"Segoe UI",sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;cursor:pointer;transition:background .15s,box-shadow .2s}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.btn:hover{background:#e1e8f0}.btn:focus-visible,#pills button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn:disabled{opacity:.35;cursor:default}.btn.pri{background:var(--amb);color:#1d2a38}.btn.pri:hover{background:#ffb81c}.btn.pri.glow{animation:glow 1.1s infinite alternate}@keyframes glow{to{box-shadow:0 0 0 7px rgba(240,165,0,.33)}}
.btn.ic{padding:0;width:42px}.btn.ic.off{opacity:.42}.btn.ic b{font-size:13px;letter-spacing:.04em}
#ttl{position:absolute;left:50%;top:0;height:58px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;text-align:center;pointer-events:none;max-width:520px}
#ttl b{font-size:20px;color:var(--navy);font-weight:800;white-space:nowrap}#ttl small{font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap;margin-top:2px}
#pills{display:flex;align-items:center;gap:5px;margin-left:6px}#bar .sp{flex:1}
#pills button{position:relative;width:34px;height:34px;border-radius:50%;border:2px solid #cfd8e2;background:#fff;font:800 14px Inter,sans-serif;color:var(--muted);cursor:pointer;padding:0}
#pills button.cur{border-color:var(--amb);background:#fff3d1;color:var(--navy);transform:scale(1.08)}#pills button.done{background:var(--grn);border-color:var(--grn);color:#fff}
#pills button em{display:none;position:absolute;top:44px;left:50%;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-weight:700;font-size:12.5px;background:var(--navy);color:#fff;border-radius:8px;padding:5px 9px;z-index:20}#pills button:hover em{display:block}
#pills i{width:10px;height:2px;background:#d6dde5;border-radius:1px}
#stepT{display:none}
/* ---- action prompt (one short line) */
#prompt{position:absolute;left:84px;top:70px;display:none;align-items:center;gap:10px;height:42px;padding:0 8px 0 12px;border-radius:21px;background:rgba(15,46,90,.9);color:#fff;font-size:16px;font-weight:700;z-index:9;box-shadow:0 6px 18px rgba(15,46,90,.25)}
#prompt.show{display:flex;animation:pin .35s ease-out}@keyframes pin{from{transform:translateX(-14px);opacity:0}}
#prompt i{width:26px;height:26px;border-radius:50%;background:var(--amb);display:grid;place-items:center}#prompt i svg{width:16px;height:16px;fill:none;stroke:#1d2a38;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#prompt button{width:30px;height:30px;border:0;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;display:grid;place-items:center}#prompt button svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round}
/* ---- tool rail */
#rail{position:absolute;left:16px;top:124px;display:flex;flex-direction:column;gap:10px;z-index:9}
#rail button{position:relative;width:52px;height:52px;border:0;border-radius:14px;background:rgba(255,255,255,.95);color:var(--navy);box-shadow:0 4px 14px rgba(15,46,90,.18);cursor:pointer;display:grid;place-items:center}
#rail button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}#rail button .fxi{font:italic 700 21px "Times New Roman",serif}
#rail button.on{background:var(--blue);color:#fff}#rail button.dis{opacity:.38;cursor:default}#rail button:hover{transform:translateX(2px)}#rail button.hi{outline:3px dashed var(--grn2);outline-offset:3px;animation:hi 0.8s infinite alternate}@keyframes hi{to{outline-color:transparent}}
#rail button span{display:none;position:absolute;left:62px;top:50%;transform:translateY(-50%);background:var(--navy);color:#fff;font-size:13px;font-weight:700;white-space:nowrap;padding:5px 10px;border-radius:8px}#rail button:hover span{display:block}
/* ---- result banner */
#banner{position:absolute;left:50%;top:70px;transform:translateX(-50%);display:none;align-items:center;gap:12px;padding:8px 18px;border-radius:16px;background:var(--red);color:#fff;z-index:9;box-shadow:0 8px 24px rgba(220,38,38,.35)}
#banner.show{display:flex;animation:bin .4s cubic-bezier(.2,1.4,.4,1)}@keyframes bin{from{transform:translate(-50%,-12px);opacity:0}}
#banner.ok{background:var(--grn);box-shadow:0 8px 24px rgba(22,163,74,.3)}#banner b{font-size:16px;letter-spacing:.06em}#banner span{font-size:15px;opacity:.95}
/* ---- readout (bottom left) */
#read{position:absolute;left:16px;bottom:16px;width:372px;display:none;background:rgba(255,255,255,.95);border-radius:16px;padding:12px 16px 12px;box-shadow:0 8px 24px rgba(15,46,90,.2);z-index:8}
#read.show{display:block}#read .g1{display:flex;align-items:baseline;justify-content:space-between}#read .n{font-size:13px;font-weight:800;letter-spacing:.1em;color:var(--navy);text-transform:uppercase}#read .p{font-size:26px;font-weight:800}
#read .bar{position:relative;height:9px;border-radius:5px;background:#e4e9ef;margin:4px 0 6px}#read .bar span{position:absolute;left:0;top:0;bottom:0;border-radius:5px;transition:width .35s}#read .bar s{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--navy);left:66.7%}
#read .v{font-family:"Cambria Math","Times New Roman",serif;font-size:17px;color:var(--ink)}#read .g2{display:flex;gap:8px;align-items:baseline;margin-top:5px;font-size:13px;color:var(--muted);border-top:1px solid #edf1f5;padding-top:5px}#read .g2 span{font-weight:800;color:var(--navy)}#read .g2 b{margin-left:auto}
/* ---- formulas drawer */
#fx{position:absolute;left:84px;top:124px;width:420px;max-height:560px;overflow:auto;display:none;background:rgba(255,255,255,.97);border-radius:16px;box-shadow:0 10px 30px rgba(15,46,90,.25);z-index:10;padding:6px 0 10px}
#fx.show{display:block}#fx .h{display:flex;justify-content:space-between;align-items:center;padding:8px 16px 4px;font-weight:800;letter-spacing:.12em;color:var(--navy);font-size:13px}
#fx .dg{margin:4px 12px 4px;background:#f4f7fb;border-radius:12px;padding:6px}
#fx .g{margin:8px 12px;background:#f6f8fb;border-radius:12px;padding:7px 12px}#fx .g h5{margin:0 0 3px;font-size:11.5px;letter-spacing:.09em;color:var(--navy);display:flex;gap:6px;align-items:center}#fx .g h5 em{margin-left:auto;font-style:normal;border-radius:8px;padding:1px 8px;font-size:11px}
#fx .g h5 u{text-decoration:none;font-size:10px;letter-spacing:.04em;background:#e8eefc;color:var(--blue);border-radius:6px;padding:1px 6px}
#fx .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:3px 0;border-bottom:1px dashed #e1e6ec}#fx .row:last-child{border-bottom:0}
#fx .row .f{font-family:"Cambria Math","Times New Roman",serif;font-size:16px}#fx .row .f small{display:block;font-family:Inter,sans-serif;font-size:10.5px;color:var(--muted)}#fx .row .v{font-weight:800;font-size:15px;color:var(--navy);white-space:nowrap}
#fx .row.bad .v{color:var(--red)}#fx .row.ok .v{color:var(--grn)}#fx .row.hl{background:#fff6dc;border-radius:6px;padding:3px 6px}
/* ---- why card (replaces the readout after a failure) */
#why{position:absolute;left:16px;bottom:16px;width:440px;display:none;background:rgba(15,46,90,.96);color:#fff;border-radius:18px;padding:14px 18px 14px;box-shadow:0 12px 34px rgba(0,0,0,.32);z-index:10}
#why.show{display:block;animation:pin .35s ease-out}#why .k{font-size:12px;letter-spacing:.14em;color:var(--amb);font-weight:800}#why h3{margin:3px 0 6px;font-size:21px;line-height:1.2}
#why .eq{font-family:"Cambria Math","Times New Roman",serif;font-size:21px;background:rgba(255,255,255,.08);border-radius:10px;padding:7px 12px;margin:6px 0;color:#ffe08a}#why p{margin:6px 0 0;font-size:15px;line-height:1.4;color:#dbe6f5}
#why .tag{display:inline-block;margin-top:8px;font-size:11px;letter-spacing:.05em;background:rgba(255,255,255,.12);color:#cfe0f7;border-radius:6px;padding:2px 7px}
#why .bs{display:flex;gap:10px;margin-top:10px}#why .btn{background:rgba(255,255,255,.14);color:#fff}#why .btn:hover{background:rgba(255,255,255,.24)}
/* ---- check question */
#ask{position:absolute;left:50%;top:124px;transform:translateX(-50%);width:560px;display:none;background:#fff;border-radius:18px;box-shadow:0 14px 40px rgba(15,46,90,.3);padding:14px 18px;z-index:11;border-top:6px solid var(--amb)}
#ask.show{display:block;animation:bin .35s ease-out}body.sg #ask{left:auto;right:16px;transform:none;width:384px}body.sg #ask.show{animation:rin .35s ease-out}@keyframes rin{from{transform:translateY(-12px);opacity:0}}#ask .k{font-size:11px;letter-spacing:.14em;font-weight:800;color:#b97800}#ask h4{margin:3px 0 10px;font-size:18px;color:var(--navy)}#ask .ch{display:flex;gap:8px;flex-wrap:wrap}
#ask button{border:2px solid #d3dae3;background:#f6f8fb;border-radius:12px;padding:9px 14px;font:700 15px Inter,sans-serif;color:var(--navy);cursor:pointer;min-height:44px}#ask button:hover{border-color:var(--blue)}#ask button.ok{background:var(--grn);color:#fff;border-color:var(--grn)}#ask button.bad{background:#fee2e2;border-color:var(--red);color:var(--red)}
/* ---- captions (max two lines) */
#cap{position:absolute;left:404px;width:776px;bottom:18px;display:flex;justify-content:center;pointer-events:none;z-index:9}body.wy #cap{left:472px;width:708px}body.wy #cap span{max-width:708px}body.pre #read{visibility:hidden}
#cap span{max-width:776px;background:rgba(10,22,40,.82);color:#fff;font-size:18px;line-height:1.38;padding:7px 14px;border-radius:10px;text-align:center;transition:opacity .4s}#cap.off span,#cap span:empty{display:none}#cap span.fade{opacity:0}
/* ---- sign-language window (bottom right, never covered) */
#sign{position:absolute;right:16px;bottom:16px;width:384px;height:288px;background:var(--sign);border-radius:16px;overflow:hidden;z-index:15;box-shadow:0 10px 28px rgba(0,0,0,.28)}
#sign.hide{display:none}#signv{position:absolute;inset:0}#sign .nm{position:absolute;left:12px;top:9px;font-size:11px;letter-spacing:.14em;font-weight:800;color:rgba(255,255,255,.85)}
#sign button{position:absolute;right:8px;top:8px;width:30px;height:30px;border:0;border-radius:9px;background:rgba(0,0,0,.25);color:#fff;font-size:18px;line-height:1;cursor:pointer}
#sign .ld{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.8);font-size:13px}
/* ---- labels, tooltip, toast */
.lbl{position:absolute;transform:translate(-50%,-50%);background:rgba(255,255,255,.95);border-radius:999px;padding:3px 10px;font:700 13px Inter,sans-serif;color:var(--navy);white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.18);transition:opacity .25s}
.lbl.ok{background:var(--grn);color:#fff}.lbl.bad{background:var(--red);color:#fff}.lbl.b{background:var(--navy);color:#fff}.lbl.m{background:rgba(15,46,90,.9);color:#ffe08a;font:700 16px "Cambria Math","Times New Roman",serif}
.lbl.hid{opacity:0}
#tip{display:none;position:absolute;z-index:14;background:rgba(15,46,90,.95);color:#fff;border-radius:9px;padding:5px 10px;font-size:14px;font-weight:700;pointer-events:none;white-space:nowrap}#tip small{display:block;font-weight:500;font-size:12px;color:#cfe0f7}
#toast{position:absolute;left:50%;top:124px;transform:translate(-50%,-10px);opacity:0;background:var(--navy);color:#fff;border-radius:12px;padding:9px 16px;font-size:15px;font-weight:600;transition:.3s;z-index:13;pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,0)}
/* ---- start / end */
.ovl{display:none;position:absolute;inset:0;z-index:14;background:rgba(15,46,90,.38);place-items:center;backdrop-filter:blur(2px)}.ovl.show{display:grid}
.ovl .card{width:600px;margin-right:380px;background:#fff;border-radius:22px;padding:24px 30px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);border-top:8px solid var(--amb)}
.card .k{font-size:13px;letter-spacing:.16em;font-weight:800;color:#b97800}.card h2{margin:6px 0 8px;font-size:32px;color:var(--navy)}.card p{font-size:17px;line-height:1.45;color:#33465c;margin:0 0 16px}
.card .path{display:flex;justify-content:center;align-items:center;gap:6px;margin:0 0 18px}.card .path span{padding:5px 11px;border-radius:9px;background:#eef2f6;color:#8a97a5;font-weight:800;font-size:12.5px;letter-spacing:.06em}.card .path span.on{background:var(--navy);color:#fff}.card .path i{color:#9aa6b4;font-style:normal}
.card .go{border:0;border-radius:999px;background:var(--amb);color:#1d2a38;font:800 19px Inter,sans-serif;padding:13px 40px;cursor:pointer}.card .bs{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.card .bs .btn{height:48px;font-size:16px}
.card .st{font-size:44px;color:var(--amb);letter-spacing:8px}
.spin{width:46px;height:46px;margin:6px auto 4px;border-radius:50%;border:5px solid #e6ebf1;border-top-color:var(--amb);animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#prompt.show,#banner.show,#why.show,#ask.show{animation:none}.btn.pri.glow{animation:none}}
</style></head><body><div id="stage"><canvas id="cv"></canvas><div id="ov" tabindex="0" aria-label="3D view"></div><div id="lbls"></div><div id="flash"></div>
<header id="bar">
<button class="btn" id="bHome" title="Home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
<nav id="pills" aria-label="Steps"></nav><span class="sp"></span>
<div id="ttl"><b id="ttlT"></b><small id="mchip"></small></div>
<button class="btn ic" id="bCC" title="Captions on / off"><b>CC</b></button>
<button class="btn ic" id="bSnd" title="Sound on / off"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg></button>
<button class="btn ic" id="bSign" title="Sign language on / off"><svg viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 0 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.3l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"/></svg></button>
<button class="btn" id="bBack"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Back</button>
<button class="btn pri" id="bNext">Next<svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
</header>
<div id="prompt"><i><svg viewBox="0 0 24 24"><path d="M9 9l5 12 1.8-5.2L21 14z"/><path d="M7.2 2.2L8 5.1"/><path d="M5.1 8l-2.9-.8"/><path d="M14 4.1L12 6"/><path d="M6 12l-1.9 2"/></svg></i><span id="promptT"></span><button id="bHelp" title="Hear it again"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button></div>
<div id="rail"></div><div id="banner"></div><div id="fx"></div><div id="read"></div><div id="why"></div><div id="ask"></div>
<div id="cap"><span></span></div>
<div id="sign"><div id="signv"></div><div class="ld" id="signld">Sign language…</div><button id="bSignX" title="Hide the signer">–</button></div>
<div id="tip"></div><div id="toast"></div><div id="start" class="ovl show"><div class="card"><h2>Footing in soil</h2><p>Preparing the 3D site…</p><div class="spin"></div></div></div><div id="praise" class="ovl"></div></div>
<script>window.__TEX=["conc","concB","ground","groundB","iron","rib","rust","sandagg","sandsand","sky","strata","wood"];</script><script>window.LAB_MODE="sim";</script><script src="lab.js"></script><script src="calc.js"></script><script src="design.js"></script></body></html>
